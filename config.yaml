device: cuda

data:
  batch_size: 256
  sequence_length: 5
  num_workers: 8
  n_pts: 16

observation:
  observation_dim: 64   # output of KeypointStateObservation → input to BeT
  embedding_dim: 128    # BeT internal embedding
  n_pts: 16
  state_dim: 2
  dropout: 0.1

action:
  num_bins: 24
  action_dim: 2

bet_model:
  num_transformer_layers: 4
  num_attention_heads: 4
  dropout: 0.1

training:
  epochs: 500
  residual_loss_scale: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.95]
  gamma: 1
  eval_interval: 1
  save_interval: 10
  checkpoint_path: "./checkpoint_keypoint"

evaluation:
  save_video: True
  video_dir: "./eval_videos_keypoint"
  num_rollout: 100
  max_episode_steps: 300
  checkpoint_path: "./checkpoint_keypoint/checkpoint_epoch10.pth"
